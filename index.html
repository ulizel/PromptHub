<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PromptHub</title>
<!--
  PromptHub — quick prompt builder for coding with an AI assistant across chats.
  Single offline HTML file. No external requests, no libraries.
  v2026.11.23i  Long "Add from library" rules wrap instead of running off the screen.
  v2026.11.23h  Same chat prompt opens with a direct instruction to keep earlier rules and mode.
  v2026.11.23g  Smaller: Handoff save and Fill from Claude share applyProject(); duplicate CSS merged.
  v2026.11.23f  Pinch and double-tap zoom disabled on phones.
  v2026.11.23e  Fill from Claude: choose "From a chat" or "From a file only" (works from the attached code alone).
  v2026.11.23d  Project tab: Fill from Claude (paste Claude's reply to fill the project).
  v2026.11.23c  Same prompt skeleton for all types; handoff code block parsed; Copy clears and moves on.
  v2026.11.23b  Renamed to PromptHub; generic example; 1-2-3 flow.  v2026.11.23a  First version.
  MAP
  - S (state, localStorage key KEY): {v, activeId, ui{}, projects[]}
    project: {id,name,file,version,about,rules[{t,on}],decisions,avoid,handoff,draft,history[]}
    draft:   {type:start|continue|followup|handoff, mode:consistent|open, kind, task, done, out, opt{}}
  - gen()     builds the prompt text from the active project + draft
  - check()   prompt-quality hints
  - renderBuild / renderProject / renderHistory: one per screen
  - Backup: Export / Import JSON in the Project screen
-->
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1c2330;--mut:#5d6778;--line:#dce1e9;--acc:#2b55c9;--accbg:#e7edfb;--warn:#8a5300;--warnbg:#fff3dc;--ok:#1d7444;--okbg:#e5f4ea;--bad:#b42318}
*{box-sizing:border-box}
html,body{touch-action:pan-x pan-y;margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:calc(6px + env(safe-area-inset-top)) 10px 6px}
.hrow{display:flex;gap:8px;align-items:center}
.brand{font-weight:800;font-size:17px;color:var(--acc);white-space:nowrap}
.hrow select{flex:1;min-width:0}
nav{display:flex;gap:4px;margin-top:6px}
nav button{flex:1}
main{max-width:760px;margin:0 auto;padding:10px 10px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
h2{font-size:15px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.step{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;margin:0 0 10px}
.step b{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-size:15px;flex:0 0 auto}
label.f{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
.hint{font-size:13px;color:var(--mut);margin:4px 0 6px}
input[type=text],textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
textarea{resize:vertical;min-height:88px}
textarea.big{min-height:110px}
textarea.out{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:260px;background:#fbfcfd}
button{font:inherit;font-size:15px;min-height:44px;min-width:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button.on{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
button.del{color:var(--bad)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #9db4f0;outline-offset:1px}
.where{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.where button{text-align:left;padding:8px 10px;line-height:1.25}
.where button small{display:block;font-size:12px;color:var(--mut);font-weight:400;margin-top:2px}
.where button.on small{color:var(--acc)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.chips button{flex:0 0 auto}
.chips.wrap button{flex:0 1 auto;max-width:100%;white-space:normal;text-align:left}
.wrap{flex-wrap:wrap;overflow:visible}
.mini{display:flex;gap:4px;align-items:center;margin-top:10px}
.mini span{font-size:14px;font-weight:600;margin-right:4px}
.mini button{flex:1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 auto}
.tog{display:flex;align-items:flex-start;gap:10px;min-height:44px;padding:8px 0;border-top:1px solid #eef1f5;cursor:pointer}
.tog:first-of-type{border-top:0}
.tog input{width:22px;height:22px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--acc)}
.tog span{flex:1}
.rule{display:flex;gap:6px;align-items:flex-start;border-top:1px solid #eef1f5;padding:6px 0}
.rule:first-child{border-top:0}
.rule input[type=checkbox]{width:22px;height:22px;margin:11px 4px 0;flex:0 0 auto;accent-color:var(--acc)}
.rule textarea{min-height:44px;flex:1}
.checks div{font-size:14px;padding:6px 10px;border-radius:8px;margin-top:6px}
.checks .w{background:var(--warnbg);color:var(--warn)}
.checks .g{background:var(--okbg);color:var(--ok)}
.checks .i{background:#f0f2f6;color:var(--mut)}
.pre{margin:0 0 8px}
.stats{font-size:13px;color:var(--mut);margin-top:6px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center}
.bar .in button{flex:1;font-size:16px}
.hist{border-top:1px solid #eef1f5;padding:8px 0}
.hist:first-child{border-top:0}
.hist .meta{font-size:13px;color:var(--mut)}
.hist pre,.pre{white-space:pre-wrap;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:#fbfcfd;border:1px solid var(--line);border-radius:8px;padding:8px}
.hist pre{max-height:220px;overflow:auto;margin:6px 0}
details{border-top:1px solid #eef1f5;margin-top:8px}
details>summary{min-height:44px;display:flex;align-items:center;font-weight:600;cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";margin-right:8px;color:var(--mut)}
details[open]>summary::before{content:"▾"}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#1c2330;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.hide{display:none!important}
.steps{margin:0;padding-left:20px;font-size:14px}
.steps li{margin:3px 0}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <span class="brand">PromptHub</span>
    <select id="proj" aria-label="Project"></select>
    <button id="newProj" title="New project" aria-label="New project">＋</button>
  </div>
  <nav class="row" id="nav">
    <button data-v="build" class="on">Build</button>
    <button data-v="project">Project</button>
    <button data-v="history">History</button>
  </nav>
</header>
<main id="main"></main>
<div class="bar" id="bar"><div class="in">
  <button class="pri" id="copyBtn">3 · Copy prompt</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* Block pinch-zoom (iOS Safari ignores user-scalable=no) and double-tap zoom. */
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive:false}));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, {passive:false});
const KEY = 'promptHub.v1';
const uid = () => Math.random().toString(36).slice(2, 10);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Rule library (tap to add to a project) ---------- */
const LIB = [
  'Never change or break existing features, behaviour, calculations, saved data or logic. If my request risks this, tell me first.',
  "Don't touch unrelated parts of the code.",
  'Everything stays offline in one HTML file: no external requests or new libraries without asking me.',
  'New options are off by default and change nothing until used.',
  'Saved data and backups must stay backward compatible.',
  'Must work on phone and desktop; touch targets at least 44px.',
  'Never use eval or new Function on user text.',
  'Keep the file small: add only what this task needs.',
  'Keep the current look and colour theme.',
  'Use plain, non-technical wording in the UI.',
  'New controls must work with mouse, touch and keyboard.',
  'Large data matters: keep it fast and light on memory.'
];

/* ---------- Seed data ---------- */
const rules = arr => arr.map(t => ({t, on:true}));
function blankDraft(type){
  return {type:type || 'continue', mode:'consistent', kind:'feature', task:'', done:'', out:'',
    opt:{ask:true, test:true, version:true, search:true, deliver:true, short:true, remind:false}};
}
function newProject(name){
  return {id:uid(), name:name || 'My project', file:'', version:'', about:'',
    rules:rules(LIB.slice(0, 3)), decisions:'', avoid:'', handoff:'', draft:blankDraft('start'), history:[]};
}
function seed(){
  const ex = {id:uid(), name:'Example: Habit tracker', file:'habit-tracker.html', version:'v1.3',
    about:'Single-file offline HTML habit tracker. Daily check-ins, streaks and a monthly chart. Used on phone and desktop; data saved on the device with JSON backup.',
    rules:rules([LIB[0], LIB[1], LIB[2], LIB[4], LIB[5]]),
    decisions:'Week starts on Monday.\nStreaks count only completed days (skipped days break a streak).',
    avoid:'Cloud sync (rejected: must stay offline).\nDark theme (not needed).',
    handoff:'', draft:blankDraft('continue'), history:[]};
  const mine = newProject('My project');
  return {v:1, activeId:mine.id, ui:{}, projects:[mine, ex]};
}

let S = null;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) { S = null; }
if (!S || !Array.isArray(S.projects) || !S.projects.length) S = seed();
S.ui = S.ui || {};
let view = 'build';
let saveTimer = 0;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 250);
}
function flush(){
  clearTimeout(saveTimer);
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('Could not save on this device. Use Export backup.'); }
}
window.addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
function P(){ return S.projects.find(p => p.id === S.activeId) || S.projects[0]; }
function D(){ const p = P(); if (!p.draft) p.draft = blankDraft(); if (!p.draft.opt) p.draft.opt = blankDraft().opt; return p.draft; }
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }

/* ---------- Prompt generator ----------
   Every prompt uses the same skeleton, in the same order, so Claude reads it the same way each time:
   intro → <project> → <last_chat> → <decisions> → <rejected_ideas> → <rules>
         → <task type mode> → <done_when>/<requirements> → <out_of_scope> → <instructions> → <reply_format>
   Context first, the request near the end (works best for long prompts). Empty sections are left out. */
const KINDS = {
  feature:  {label:'Feature',  line:''},
  fix:      {label:'Bug fix',  line:'This is a bug fix: find the root cause first and explain it in one or two sentences, then fix only that cause.'},
  plan:     {label:'Plan only',line:'Plan only: do not write or change any code. Give a short prioritised plan with options, trade-offs and risks, then wait for my approval.'},
  review:   {label:'Review',   line:'Review only: do not change code. List findings by severity, each with a suggested fix, then wait for my decision.'},
  tidy:     {label:'Tidy up',  line:'Tidy up without changing behaviour (for example a smaller file or clearer comments). The result must behave exactly the same; prove it with a before/after check.'},
  question: {label:'Question', line:'Answer my question. No code changes.'}
};
const NOCODE = k => k === 'plan' || k === 'review' || k === 'question';
const TYPES = {
  start:    {label:'New project', sub:'First chat'},
  continue: {label:'New chat',    sub:'Carry on from last chat'},
  followup: {label:'Same chat',   sub:'Next change'},
  handoff:  {label:'Ending chat', sub:'Get a handoff note'}
};

function tag(n, body, attrs){
  body = (body || '').trim(); if (!body) return '';
  const a = attrs ? Object.entries(attrs).map(([k, v]) => ` ${k}="${v}"`).join('') : '';
  return `<${n}${a}>\n${body}\n</${n}>`;
}
function bullets(txt){
  return (txt || '').split('\n').map(s => s.trim()).filter(Boolean)
    .map(s => '- ' + s.replace(/^[-•*]\s*/, '')).join('\n');
}
function join(parts){ return parts.filter(s => s && s.trim()).join('\n\n'); }
function activeRules(p, max){
  const r = (p.rules || []).filter(x => x.on && x.t.trim()).map(x => '- ' + x.t.trim());
  return (max ? r.slice(0, max) : r).join('\n');
}
function projLines(p){
  return [p.name ? 'Name: ' + p.name : '', p.file ? 'File: ' + p.file : '', p.about ? 'What it is: ' + p.about : ''].filter(Boolean).join('\n');
}

function instructions(d, p){
  const o = d.opt, code = !NOCODE(d.kind), L = [];
  if (d.type === 'start') {
    L.push(d.mode === 'open'
      ? 'Open mode: if you see a better design or important missing features, propose them first; build only what I approve.'
      : "Consistent mode: build exactly what I describe; don't add extra features.");
  } else {
    L.push(d.mode === 'open'
      ? 'Open mode: you may propose better approaches or related improvements, each with impact and risk, but build only this task until I approve more. Existing calculations and saved data must not change without my OK.'
      : 'Consistent mode: build on top of the current version. Change only what this task needs, match the existing code style and UI, and leave everything else exactly as it is. If the task would change existing behaviour, stop and ask first.');
  }
  if (d.type === 'continue' && (p.decisions.trim() || p.avoid.trim())) L.push('Keep everything in <decisions>. Do not bring back anything in <rejected_ideas>.');
  if (KINDS[d.kind].line) L.push(KINDS[d.kind].line);
  if (d.type === 'continue' && o.search) L.push('To save tokens: read the header comment and architecture map first, then search the file for the parts you need instead of reading all of it.');
  if (d.kind === 'question') { if (o.ask) L.push('If my question is unclear, ask before answering.'); }
  else if (o.ask) L.push('Before building, list any ambiguities and risks as multiple-choice questions and stop; build after I answer. If nothing is unclear, say so and go ahead.');
  else L.push("Don't stop to ask unless something is risky or impossible. Make sensible choices and list them in your reply.");
  if (code) {
    if (d.type === 'start') L.push('Put a short architecture map and a version history comment at the top of the file, so a future chat can understand the code without reading all of it.');
    else if (o.version) L.push('Add a new version entry in the comment at the top (newest three in full, older ones one line) and keep the architecture map current.');
    if (o.test) L.push('Test before delivering: nothing that worked before is broken, phone-size screen works, no console errors.');
    if (o.deliver) L.push(d.type === 'start'
      ? 'Deliver one complete standalone file' + (p.file ? ' named ' + p.file : '') + '.'
      : 'Deliver only the complete updated file' + (p.file ? ' (' + p.file + ')' : '') + ', same file name.');
  }
  return L.map(s => '- ' + s).join('\n');
}

function replyFormat(d){
  if (!d.opt.short) return '';
  if (NOCODE(d.kind)) return 'Short and scannable. End with the decisions you need from me, if any.';
  return ['Short, in this order:', '1. Changed: one line each', '2. Tested: what you checked',
    "3. Limits: what you couldn't test, and any risk", '4. Version: file name and new version'].join('\n');
}

const HO_KEYS = ['FILE', 'VERSION', 'CHANGED', 'DECISIONS', 'REJECTED', 'OPEN ISSUES', 'NEXT'];
function handoffAsk(p){
  return [
    "I'm about to start a new chat. Write a handoff note for it.",
    'Put it in ONE code block, using exactly these headings (write "none" if a section is empty):',
    '',
    'FILE: file name',
    'VERSION: current version' + (p.version ? ' (I think it is ' + p.version + ')' : ''),
    'CHANGED:',
    '- one line per change made in this chat',
    'DECISIONS:',
    '- decisions I made, including options I picked',
    'REJECTED:',
    '- ideas rejected or scrapped, with a short reason',
    'OPEN ISSUES:',
    '- known bugs and untested areas',
    'NEXT:',
    '- next steps I mentioned',
    '',
    "Under 250 words. Only include what actually happened in this chat; don't invent next steps."
  ].join('\n');
}
const ALL_KEYS = ['NAME', 'ABOUT', 'RULES'].concat(HO_KEYS);
const KEY_RE = new RegExp('^[#*\\s]*(' + ALL_KEYS.join('|') + ')[*\\s]*:[*\\s]*(.*)$', 'i');
function parseHandoff(text){
  const sec = {}; let cur = null, found = 0;
  text.replace(/```[a-z]*\n?/gi, '').split('\n').forEach(raw => {
    const line = raw.trim(); if (!line) return;
    const m = line.match(KEY_RE);
    if (m) { cur = m[1].toUpperCase().replace(/\s+/g, ' '); sec[cur] = sec[cur] || []; found++; if (m[2].trim()) sec[cur].push(m[2].trim()); return; }
    if (cur) sec[cur].push(line);
  });
  if (found < 3) return null;
  ALL_KEYS.forEach(k => {
    sec[k] = (sec[k] || []).map(s => s.replace(/^[-•*]\s*/, '').trim()).filter(s => s && !/^none\.?$/i.test(s));
  });
  return sec;
}
function projectAsk(src){
  if (src === 'file') return [
    "I've attached my project's code. There is no chat history: work only from the file (header comments, version notes and the code itself).",
    'Summarise it so I can load it into my prompt tool. Put it in ONE code block, using exactly these headings (write "none" if a section is empty or not visible in the file):',
    '',
    'NAME: app name (from the title or header)',
    'FILE: file name',
    'VERSION: current version (from the header or version notes)',
    'ABOUT: 2-3 sentences: what it does, who it seems to be for, which devices it supports',
    'RULES:',
    '- constraints the code clearly follows and a future change must keep (for example: single offline file, no external libraries, saved-data format, touch-friendly sizes), one per line',
    'DECISIONS:',
    '- design choices stated in comments or clearly deliberate in the code',
    'REJECTED:',
    '- only ideas the comments say were removed or rejected',
    'CHANGED:',
    '- the latest entries from the version notes',
    'OPEN ISSUES:',
    '- TODO/FIXME comments and clear problems you can see',
    'NEXT:',
    '- only next steps written in the comments',
    '',
    "Under 400 words. Don't guess: if something isn't in the file, write none. Don't change the code."
  ].join('\n');
  return [
    'Summarise this project so I can load it into my prompt tool. If the project file is attached, also use its header comment.',
    'Put it in ONE code block, using exactly these headings (write "none" if a section is empty):',
    '',
    'NAME: project name',
    'FILE: main file name',
    'VERSION: current version',
    'ABOUT: 2-3 sentences: what it does, who uses it, which devices',
    'RULES:',
    "- standing rules I've given you for this project, one per line",
    'DECISIONS:',
    '- decisions I made that must be kept',
    'REJECTED:',
    '- ideas rejected or scrapped, with a short reason',
    'CHANGED:',
    '- most recent changes',
    'OPEN ISSUES:',
    '- known bugs and untested areas',
    'NEXT:',
    '- next steps I mentioned',
    '',
    "Under 400 words. Only include what I actually said or what actually happened; don't invent rules or plans."
  ].join('\n');
}
// fromHandoff: Ending chat note (never touches name/description/rules; memory merge is optional)
function applyProject(h, fromHandoff){
  const p = P(), msg = [], keep = !fromHandoff || S.ui.mergeMem !== false;
  if (h.FILE[0]) p.file = h.FILE[0];
  if (h.VERSION[0] && h.VERSION[0] !== p.version) { p.version = h.VERSION[0]; if (fromHandoff) msg.push(p.version); }
  if (!fromHandoff) {
    if (h.NAME[0]) p.name = h.NAME[0];
    if (h.ABOUT.length) p.about = h.ABOUT.join(' ');
    const have = new Set(p.rules.map(r => r.t.trim().toLowerCase()));
    let n = 0;
    h.RULES.forEach(t => { if (!have.has(t.toLowerCase())) { p.rules.push({t, on:true}); have.add(t.toLowerCase()); n++; } });
    if (n) msg.push('+' + n + ' rule' + (n > 1 ? 's' : ''));
  }
  const st = [['Changed', h.CHANGED], ['Open issues', h['OPEN ISSUES']], ['Next', h.NEXT]];
  if (keep) {
    const a = mergeLines('decisions', h.DECISIONS), r = mergeLines('avoid', h.REJECTED);
    if (a) msg.push('+' + a + ' decision' + (a > 1 ? 's' : ''));
    if (r) msg.push('+' + r + ' rejected');
  } else st.push(['Decisions', h.DECISIONS], ['Rejected', h.REJECTED]);
  const txt = st.filter(x => x[1].length).map(x => x[0] + ':\n' + x[1].map(s => '- ' + s).join('\n')).join('\n');
  if (txt || fromHandoff) p.handoff = txt;
  return msg;
}
function mergeLines(field, items){
  const p = P(), have = new Set(p[field].split('\n').map(s => s.trim().replace(/^[-•*]\s*/, '').toLowerCase()).filter(Boolean));
  let n = 0;
  items.forEach(s => { if (!have.has(s.toLowerCase())) { p[field] = (p[field].trim() ? p[field].trim() + '\n' : '') + s; have.add(s.toLowerCase()); n++; } });
  return n;
}

function gen(){
  const p = P(), d = D();
  if (d.type === 'handoff') return handoffAsk(p);
  const tail = [
    tag('task', (d.task || '').trim(), {type:KINDS[d.kind].label, mode:d.mode}),
    tag(d.type === 'start' ? 'requirements' : 'done_when', bullets(d.done)),
    tag('out_of_scope', bullets(d.out)),
    tag('instructions', instructions(d, p)),
    tag('reply_format', replyFormat(d))
  ];
  if (d.type === 'start') return join(["I'm starting a new project with you.", tag('project', projLines(p)), tag('rules', activeRules(p)), ...tail]);
  if (d.type === 'followup') return join(['Next request. Keep following the rules and working mode from earlier in this chat.',
    d.opt.remind ? tag('rules', activeRules(p, 3)) : '', ...tail]);
  const intro = "I'm continuing work on " + (p.name || 'my project') + ' in a new chat. The latest file is attached.' +
    (p.version ? ' Check that its version is ' + p.version + "; if it isn't, tell me before doing anything." : '');
  return join([intro, tag('project', projLines(p)), tag('last_chat', p.handoff), tag('decisions', bullets(p.decisions)),
    tag('rejected_ideas', bullets(p.avoid)), tag('rules', activeRules(p)), ...tail]);
}

/* ---------- Prompt check: w = fix this, i = tip ---------- */
const VAGUE = /\b(improve|better|nicer|cleaner|optimi[sz]e|enhance|fix it|make it work|clean up|modern|polish|smarter|best)\b/i;
function check(text){
  const p = P(), d = D(), w = [];
  if (d.type === 'handoff') return w;
  const task = (d.task || '').trim();
  if (!task) { w.push(['w', 'Step 2: type what you want.']); return w; }
  if (task.length < 40) w.push(['w', 'Very short. Add what, where (which screen or feature) and why.']);
  if (VAGUE.test(task) && !d.done.trim()) w.push(['w', '"' + task.match(VAGUE)[0] + '" is open to interpretation. Add "Done when" under More detail.']);
  else if ((d.kind === 'feature' || d.kind === 'fix') && !d.done.trim()) w.push(['i', 'Tip: "Done when" under More detail tells Claude how to check it.']);
  if (d.kind === 'fix' && !/(when|after|expected|instead|should|shows|but)/i.test(task)) w.push(['w', 'For a bug, say what you did, what you expected and what happened instead.']);
  if (d.type === 'continue') {
    if (!p.handoff.trim()) w.push(['i', 'No handoff saved. Next time, use "Ending chat" before leaving a chat.']);
    w.push(['i', 'Attach the latest file' + (p.file ? ' (' + p.file + ')' : '') + ' with this prompt.']);
  }
  if (d.type === 'start' && !p.about.trim()) w.push(['i', 'Tip: fill in "What it is" so Claude knows the users and devices.']);
  const tok = Math.round(text.length / 4);
  if (tok > 1800) w.push(['w', 'Long prompt (~' + tok + ' tokens). Trim old decisions or the handoff in Project.']);
  return w;
}

/* ---------- Rendering ---------- */
function renderHeader(){
  $('#proj').innerHTML = S.projects.map(p => `<option value="${esc(p.id)}"${p.id === S.activeId ? ' selected' : ''}>${esc(p.name || 'Untitled')}</option>`).join('');
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  $('#bar').classList.toggle('hide', view !== 'build');
}
function render(){
  renderHeader();
  if (view === 'build') renderBuild();
  else if (view === 'project') renderProject();
  else renderHistory();
}
function btns(attr, opts, cur){
  return opts.map(([v, l]) => `<button data-${attr}="${v}" class="${v === cur ? 'on' : ''}" aria-pressed="${v === cur}">${l}</button>`).join('');
}
function tog(key, label, on){
  return `<label class="tog"><input type="checkbox" data-opt="${key}"${on ? ' checked' : ''}><span>${label}</span></label>`;
}

function renderBuild(){
  const p = P(), d = D(), ho = d.type === 'handoff', st = d.type === 'start', o = d.opt;
  if (st && d.kind !== 'feature' && d.kind !== 'plan') d.kind = 'feature';
  const kinds = Object.entries(KINDS).filter(([k]) => !st || k === 'feature' || k === 'plan').map(([k, v]) => [k, v.label]);
  const moreOpen = (d.done || d.out) ? ' open' : '';
  const merge = S.ui.mergeMem !== false;
  $('#main').innerHTML = `
  <div class="card">
    <div class="step"><b>1</b>Where are you?</div>
    <div class="where">${Object.entries(TYPES).map(([k, v]) =>
      `<button data-type="${k}" class="${k === d.type ? 'on' : ''}" aria-pressed="${k === d.type}">${v.label}<small>${v.sub}</small></button>`).join('')}</div>
  </div>

  <div class="card ${ho ? 'hide' : ''}">
    <div class="step"><b>2</b>${st ? 'Describe the project' : 'What do you want?'}</div>
    ${st ? `
      <div class="row">
        <div><label class="f" for="s_name">Project name</label><input type="text" id="s_name" data-p="name" value="${esc(p.name)}"></div>
        <div><label class="f" for="s_file">File name</label><input type="text" id="s_file" data-p="file" value="${esc(p.file)}" placeholder="my-app.html"></div>
      </div>
      <label class="f" for="s_about">What it is <span class="hint">(who uses it, which devices)</span></label>
      <textarea id="s_about" data-p="about" style="min-height:66px" placeholder="Offline habit tracker for my phone and laptop">${esc(p.about)}</textarea>
      <label class="f">First request</label>` : ''}
    <div class="chips wrap">${btns("kind", kinds, d.kind)}</div>
    <textarea id="t_task" class="big" data-f="task" style="margin-top:8px" aria-label="Task"
      placeholder="${d.kind === 'fix' ? 'What I did → what I expected → what happened instead' : st ? 'What should the first version do?' : d.kind === 'question' ? 'Your question' : 'What to change, where (screen/feature) and why'}">${esc(d.task)}</textarea>
    <div class="mini"><span>Mode</span>${btns('mode', [['consistent','Consistent'],['open','Open']], d.mode)}</div>
    <p class="hint">${d.mode === 'open' ? 'Claude may propose improvements, but builds only the task until you approve.' : 'Builds on top of what exists. Nothing else changes.'}</p>
    ${tog('ask', d.kind === 'question' ? 'Ask me if the question is unclear' : 'Ask me questions before building (off = just do it, list choices made)', o.ask)}
    <details${moreOpen}>
      <summary>More detail (optional)</summary>
      <label class="f" for="t_done">${st ? 'Requirements' : 'Done when'} <span class="hint">(one per line)</span></label>
      <textarea id="t_done" data-f="done" placeholder="${st ? 'Works offline on phone\nSaves data on the device' : 'Tapping X shows Y\nTotals match before and after'}">${esc(d.done)}</textarea>
      <label class="f" for="t_out">Out of scope <span class="hint">(one per line)</span></label>
      <textarea id="t_out" data-f="out" placeholder="Don't change the colours\nNo new buttons in the top bar">${esc(d.out)}</textarea>
    </details>
    <details>
      <summary>Settings</summary>
      ${d.type === 'continue' ? tog('search', 'Save tokens: read the header map, then search the file', o.search) : ''}
      ${NOCODE(d.kind) ? '' : tog('test', 'Test before delivering', o.test)}
      ${NOCODE(d.kind) || st ? '' : tog('version', 'Add a version entry at the top of the file', o.version)}
      ${NOCODE(d.kind) ? '' : tog('deliver', 'Deliver only the complete updated file', o.deliver)}
      ${tog('short', 'Short reply in a fixed format', o.short)}
      ${d.type === 'followup' ? tog('remind', 'Repeat my top 3 rules (useful in long chats)', o.remind) : ''}
      <p class="hint">Settings are kept per project. Rules, decisions and rejected ideas live in the Project tab.</p>
    </details>
  </div>

  <div class="card ${ho ? '' : 'hide'}">
    <div class="step"><b>2</b>Send, then paste the reply</div>
    <p class="hint">Tap <b>3 · Copy</b>, send it as the last message in your current chat. Claude answers in one code block: copy it and paste here.</p>
    <textarea id="hoIn" placeholder="Paste Claude's handoff note…"></textarea>
    <label class="tog"><input type="checkbox" id="mergeMem"${merge ? ' checked' : ''}><span>Add new decisions and rejected ideas to the project memory</span></label>
    <div class="row"><button class="pri" id="hoSave">Save handoff</button></div>
    ${p.handoff ? `<details><summary>Current handoff</summary><pre class="pre">${esc(p.handoff)}</pre></details>` : ''}
  </div>

  <div class="card">
    <div class="checks" id="checks"></div>
    <details${S.ui.preview ? ' open' : ''} id="prevBox">
      <summary>Preview &amp; edit</summary>
      <textarea class="out" id="out" spellcheck="false" aria-label="Prompt preview"></textarea>
      <p class="hint">Edits here are used when you copy. Changing anything above rebuilds the prompt.</p>
    </details>
    <div class="stats" id="stats"></div>
  </div>

  <div class="card">
    <details><summary>How it works</summary>
      <ol class="steps">
        <li><b>New project</b>: your first chat. After copying, PromptHub switches to Same chat.</li>
        <li><b>Same chat</b>: each next change. The task box clears after each copy (it's kept in History).</li>
        <li><b>Ending chat</b>: when a chat gets long, get a handoff note and paste it back. Decisions and rejected ideas are added to the project.</li>
        <li><b>New chat</b>: attach the latest file and send. Everything the new chat needs is included.</li>
      </ol>
      <p class="hint">Desktop: Ctrl/⌘ + Enter copies.</p>
    </details>
  </div>`;
  $('#copyBtn').textContent = ho ? '3 · Copy handoff request' : '3 · Copy prompt';
  refreshOut();
}

function refreshOut(){
  const out = $('#out'); if (!out) return;
  out.value = gen();
  updateStats(out.value);
}
function updateStats(text){
  $('#stats').textContent = text.length.toLocaleString() + ' characters · about ' + Math.max(1, Math.round(text.length / 4)).toLocaleString() + ' tokens';
  const w = check(text);
  const fix = w.some(x => x[0] === 'w');
  $('#checks').innerHTML = (D().type === 'handoff' || fix ? '' : '<div class="g">✓ Ready to copy</div>') +
    w.map(x => `<div class="${x[0]}">${x[0] === 'w' ? '• ' : ''}${esc(x[1])}</div>`).join('');
}

function renderProject(){
  const p = P();
  const fromFile = S.ui.fillSrc === 'file';
  const empty = !p.about.trim() && !p.decisions.trim() && !p.handoff.trim();
  $('#main').innerHTML = `
  <div class="card">
    <details id="fillBox"${empty || S.ui.fillOpen ? ' open' : ''}>
      <summary>Fill from Claude</summary>
      <p class="hint">Nothing to type: Claude writes the project details for you.</p>
      <div class="seg row">${btns('src', [['chat','From a chat'],['file','From a file only']], S.ui.fillSrc || 'chat')}</div>
      <p class="hint">${fromFile
        ? 'Use when you only have the code: Claude reads the file and fills in what it can see.'
        : 'Use in the chat where you worked on the project, so your rules and decisions are included.'}</p>
      <ol class="steps">
        <li>${fromFile ? 'Copy the request. Open a new chat, attach your file, and send it.' : "Copy the request and send it in your project's chat."}</li>
        <li>Claude replies in one code block. Copy it.</li>
        <li>Paste it below and tap Fill.</li>
      </ol>
      <div class="row" style="margin-top:8px"><button class="pri" id="askProj">1 · Copy request</button></div>
      <textarea id="projIn" style="margin-top:8px" placeholder="3 · Paste Claude's reply here…"></textarea>
      <div class="row" style="margin-top:8px"><button class="pri" id="fillProj">Fill this project</button></div>
      <p class="hint">${fromFile ? 'A file only shows what the code shows: add your own rules and rejected ideas below afterwards. ' : ''}Name, file, version and description are replaced. Rules, decisions and rejected ideas are added (duplicates skipped). Latest changes become the handoff.</p>
    </details>
  </div>

  <div class="card">
    <h2>Project</h2>
    <label class="f" for="p_name">Name</label>
    <input type="text" id="p_name" data-p="name" value="${esc(p.name)}">
    <div class="row">
      <div><label class="f" for="p_file">File name</label><input type="text" id="p_file" data-p="file" value="${esc(p.file)}" placeholder="my-app.html"></div>
      <div><label class="f" for="p_ver">Current version</label><input type="text" id="p_ver" data-p="version" value="${esc(p.version)}" placeholder="v1.0"></div>
    </div>
    <label class="f" for="p_about">What it is</label>
    <p class="hint">What it does, who uses it, which devices. Two or three sentences.</p>
    <textarea id="p_about" data-p="about">${esc(p.about)}</textarea>
  </div>

  <div class="card">
    <h2>Rules (every prompt)</h2>
    <p class="hint">Untick to leave a rule out without deleting it.</p>
    <div id="rules">${(p.rules || []).map((r, i) => `
      <div class="rule">
        <input type="checkbox" data-ron="${i}"${r.on ? ' checked' : ''} aria-label="Use this rule">
        <textarea data-rt="${i}" rows="2" aria-label="Rule">${esc(r.t)}</textarea>
        <button class="del" data-rdel="${i}" aria-label="Delete rule">✕</button>
      </div>`).join('')}</div>
    <div class="row" style="margin-top:8px"><button id="addRule">Add rule</button></div>
    <details><summary>Add from library</summary>
      <div class="chips wrap">${LIB.map((t, i) => `<button data-lib="${i}" style="text-align:left">${esc(t)}</button>`).join('')}</div>
    </details>
  </div>

  <div class="card">
    <h2>Memory for new chats</h2>
    <label class="f" for="p_dec">Decisions to keep <span class="hint">(one per line)</span></label>
    <textarea id="p_dec" data-p="decisions">${esc(p.decisions)}</textarea>
    <label class="f" for="p_avoid">Do not bring back <span class="hint">(scrapped or rejected ideas)</span></label>
    <textarea id="p_avoid" data-p="avoid">${esc(p.avoid)}</textarea>
    <label class="f" for="p_ho">Last handoff</label>
    <textarea id="p_ho" data-p="handoff" placeholder="Filled from Build → Ending chat">${esc(p.handoff)}</textarea>
  </div>

  <div class="card">
    <h2>Backup</h2>
    <p class="hint">Saved on this device only. Export a backup now and then, and to move to another device.</p>
    <div class="row">
      <button id="exp">Export backup</button>
      <button id="imp">Import backup</button>
      <input type="file" id="impFile" accept=".json,application/json" class="hide">
    </div>
    <div class="row" style="margin-top:8px">
      <button id="dup">Duplicate project</button>
      <button class="del" id="delProj">Delete project</button>
    </div>
  </div>`;
}

function renderHistory(){
  const p = P(), h = p.history || [];
  $('#main').innerHTML = `<div class="card"><h2>History · ${esc(p.name)}</h2>${
    h.length ? h.map((x, i) => `
    <div class="hist">
      <div class="meta">${esc(new Date(x.at).toLocaleString())} · ${esc(x.label)}</div>
      <pre>${esc(x.text)}</pre>
      <div class="row">
        <button data-hcopy="${i}">Copy</button>
        <button data-hload="${i}">Reuse</button>
        <button class="del" data-hdel="${i}" aria-label="Delete">✕</button>
      </div>
    </div>`).join('') : '<p class="hint">Prompts you copy appear here.</p>'
  }</div>`;
}

/* ---------- Copy (also saves to history) ---------- */
function copyText(text){
  return new Promise(res => {
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => res(true), () => res(fallback()));
    else res(fallback());
  });
  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '-1000px';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    let ok = false; try { ok = document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    return ok;
  }
}
function addHistory(text){
  const p = P(), d = D();
  p.history = p.history || [];
  if (p.history[0] && p.history[0].text === text) return;
  const label = TYPES[d.type].label + (d.type === 'handoff' ? '' : ' · ' + KINDS[d.kind].label + ' · ' + (d.mode === 'open' ? 'Open' : 'Consistent'));
  p.history.unshift({at:Date.now(), label, text, form:JSON.parse(JSON.stringify(d))});
  if (p.history.length > 50) p.history.length = 50;
  save();
}

/* ---------- Events ---------- */
$('#nav').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; view = b.dataset.v; render(); window.scrollTo(0, 0); });
$('#proj').addEventListener('change', e => { S.activeId = e.target.value; save(); render(); });
$('#newProj').addEventListener('click', () => {
  const name = prompt('Project name');
  if (name === null) return;
  const p = newProject(name.trim() || 'New project');
  S.projects.push(p); S.activeId = p.id; save(); view = 'project'; render();
  toast('Project created. Fill it in, or use Fill from Claude.');
});

$('#main').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const p = P(), d = D(), ds = b.dataset;
  if (ds.type) { d.type = ds.type; save(); renderBuild(); return; }
  if (ds.mode) { d.mode = ds.mode; save(); renderBuild(); return; }
  if (ds.kind) { d.kind = ds.kind; save(); renderBuild(); return; }
  if (b.id === 'hoSave') {
    const v = $('#hoIn').value.trim();
    if (!v) { toast("Paste Claude's handoff note first"); $('#hoIn').focus(); return; }
    const h = parseHandoff(v), msg = ['Handoff saved'];
    if (h) msg.push(...applyProject(h, true));
    else {
      p.handoff = v;
      const m = v.match(/\bv\d+(?:\.\d+)+[a-z]?\b/i);
      if (m && m[0] !== p.version) { p.version = m[0]; msg.push(m[0]); }
    }
    msg.push('next: New chat');
    d.type = 'continue'; save(); renderBuild(); toast(msg.join(' · ')); return;
  }
  if (ds.src) { S.ui.fillSrc = ds.src; save(); renderProject(); return; }
  if (b.id === 'askProj') { copyText(projectAsk(S.ui.fillSrc)).then(ok => toast(ok ? "Copied · send it in your project's chat" : 'Copy failed')); return; }
  if (b.id === 'fillProj') {
    const v = $('#projIn').value.trim();
    if (!v) { toast("Paste Claude's reply first"); $('#projIn').focus(); return; }
    const h = parseHandoff(v);
    if (!h) { toast("Couldn't read it. Paste the whole code block Claude sent."); return; }
    const willReplace = (h.ABOUT.length && p.about.trim() && h.ABOUT.join(' ') !== p.about) || (h.NAME[0] && p.name !== h.NAME[0] && p.about.trim());
    if (willReplace && !confirm('Replace this project\'s name and description with Claude\'s? Rules, decisions and rejected ideas are added, not replaced.')) return;
    const msg = applyProject(h);
    D().type = 'continue';
    save(); render(); toast(['Project filled'].concat(msg).join(' · '));
    return;
  }
  if (ds.rdel != null) { p.rules.splice(+ds.rdel, 1); save(); renderProject(); return; }
  if (b.id === 'addRule') { p.rules.push({t:'', on:true}); save(); renderProject(); const t = document.querySelectorAll('[data-rt]'); t[t.length - 1].focus(); return; }
  if (ds.lib != null) {
    const t = LIB[+ds.lib];
    if (p.rules.some(r => r.t === t)) { toast('Already in this project'); return; }
    p.rules.push({t, on:true}); save(); renderProject(); toast('Rule added'); return;
  }
  if (b.id === 'exp') {
    flush();
    const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'prompthub-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); return;
  }
  if (b.id === 'imp') { $('#impFile').click(); return; }
  if (b.id === 'dup') {
    const c = JSON.parse(JSON.stringify(p)); c.id = uid(); c.name = p.name + ' (copy)'; c.history = [];
    S.projects.push(c); S.activeId = c.id; save(); render(); toast('Duplicated'); return;
  }
  if (b.id === 'delProj') {
    if (S.projects.length < 2) { toast('Keep at least one project'); return; }
    if (!confirm('Delete "' + p.name + '" and its history?')) return;
    S.projects = S.projects.filter(x => x.id !== p.id); S.activeId = S.projects[0].id; save(); render(); return;
  }
  if (ds.hcopy != null) { copyText(p.history[+ds.hcopy].text).then(ok => toast(ok ? 'Copied' : 'Copy failed: select the text and copy it')); return; }
  if (ds.hload != null) {
    const x = p.history[+ds.hload];
    if (x.form) p.draft = JSON.parse(JSON.stringify(x.form));
    save(); view = 'build'; render(); toast('Loaded into Build'); return;
  }
  if (ds.hdel != null) { p.history.splice(+ds.hdel, 1); save(); renderHistory(); return; }
});

$('#main').addEventListener('input', e => {
  const el = e.target, p = P(), d = D();
  if (el.dataset.f) { d[el.dataset.f] = el.value; save(); refreshOut(); return; }
  if (el.dataset.p) { p[el.dataset.p] = el.value; save(); if (el.dataset.p === 'name') renderHeader(); if (view === 'build') refreshOut(); return; }
  if (el.dataset.rt != null) { p.rules[+el.dataset.rt].t = el.value; save(); return; }
  if (el.id === 'out') { updateStats(el.value); return; }
});
$('#main').addEventListener('toggle', e => {
  if (e.target.id === 'prevBox') { S.ui.preview = e.target.open; save(); }
  if (e.target.id === 'fillBox') { S.ui.fillOpen = e.target.open; save(); }
}, true);
$('#main').addEventListener('change', e => {
  const el = e.target, p = P(), d = D();
  if (el.dataset.opt) { d.opt[el.dataset.opt] = el.checked; save(); refreshOut(); return; }
  if (el.id === 'mergeMem') { S.ui.mergeMem = el.checked; save(); return; }
  if (el.dataset.ron != null) { p.rules[+el.dataset.ron].on = el.checked; save(); return; }
  if (el.id === 'impFile' && el.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const x = JSON.parse(r.result);
        if (!x || !Array.isArray(x.projects) || !x.projects.length) throw 0;
        if (!confirm('Replace all projects on this device with this backup?')) return;
        x.projects.forEach(q => { q.id = q.id || uid(); q.rules = q.rules || []; q.history = q.history || []; q.draft = q.draft || blankDraft();
          ['name','file','version','about','decisions','avoid','handoff'].forEach(k => q[k] = q[k] || ''); });
        S = x; S.ui = S.ui || {};
        if (!S.projects.some(q => q.id === S.activeId)) S.activeId = S.projects[0].id;
        save(); render(); toast('Backup imported');
      } catch(err) { toast('Not a valid PromptHub backup'); }
    };
    r.readAsText(el.files[0]); el.value = '';
  }
});

$('#copyBtn').addEventListener('click', () => {
  const o = $('#out'); if (!o || !o.value.trim()) return;
  const d = D();
  if (d.type !== 'handoff' && !(d.task || '').trim()) { toast('Step 2: type what you want first'); const t = $('#t_task'); if (t) t.focus(); return; }
  const text = o.value;
  copyText(text).then(ok => {
    if (!ok) { toast('Copy failed: open Preview & edit, select the text and copy it'); return; }
    addHistory(text);
    if (d.type === 'handoff') { toast("Copied · send it, then paste Claude's reply here"); const h = $('#hoIn'); if (h) h.focus({preventScroll:true}); return; }
    const next = (d.type === 'start' || d.type === 'continue') ? 'followup' : d.type;
    d.task = d.done = d.out = ''; d.kind = 'feature';
    const moved = next !== d.type; d.type = next;
    save(); renderBuild(); window.scrollTo(0, 0);
    toast('Copied · saved in History' + (moved ? ' · next: Same chat' : ''));
  });
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && view === 'build') { e.preventDefault(); $('#copyBtn').click(); }
});

render();
</script>
